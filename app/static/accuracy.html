<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Precog · Accuracy record</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0a0e17; --panel: #111827; --inset: #0f172a; --line: #1e293b; --line-2: #334155;
    --fg: #e0e6f0; --strong: #f1f5f9; --muted: #94a3b8; --dim: #64748b;
    --accent: #60a5fa; --compare: #a78bfa; --good: #22c55e; --bad: #ef4444; --even: #eab308;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--fg); font-size: 14px; line-height: 1.5; }
  a { color: var(--accent); }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .header h1 { font-size: 20px; font-weight: 700; color: var(--accent); letter-spacing: 2px; }
  .header h1 span { color: var(--muted); font-weight: 500; letter-spacing: 0; font-size: 15px; margin-left: 10px; }
  .header .meta { font-size: 13px; color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
  .header .meta a { text-decoration: none; font-weight: 600; }
  main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 56px; display: flex; flex-direction: column; gap: 20px; }
  .lede { font-size: 15px; color: var(--muted); max-width: 70ch; }
  .lede strong { color: var(--strong); font-weight: 600; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); font-weight: 600; margin-bottom: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
  .verdicts { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .verdict { display: flex; flex-direction: column; gap: 10px; }
  .verdict .q { font-size: 15px; font-weight: 600; color: var(--strong); }
  .chip { align-self: flex-start; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 4px; letter-spacing: 0.3px; }
  .chip.ahead { background: #14532d; color: #86efac; }
  .chip.behind { background: #7f1d1d; color: #fca5a5; }
  .chip.even { background: #713f12; color: #fde68a; }
  .chip.live { background: #1e3a5f; color: #93c5fd; }
  .chip.recon { background: var(--line); color: var(--muted); }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pair > div { background: var(--inset); border-radius: 8px; padding: 10px; }
  .pair .num { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .pair .num.precog { color: var(--accent); }
  .pair .num.other { color: var(--compare); }
  .pair .lbl { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
  .verdict p { font-size: 13px; color: var(--muted); }
  .big { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .big.good { color: var(--good); } .big.bad { color: var(--bad); } .big.even { color: var(--even); }
  .chart-wrap { position: relative; height: 260px; }
  .two-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  th { text-align: right; font-size: 11px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px; padding: 6px 10px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
  td { text-align: right; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; padding-left: 0; }
  tr:last-child td { border-bottom: none; }
  td.win { color: var(--good); font-weight: 600; }
  td.loss { color: var(--bad); font-weight: 600; }
  td.muted { color: var(--muted); }
  .area-list { list-style: none; display: flex; flex-direction: column; }
  .area-list li { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .area-list li:last-child { border-bottom: none; }
  .area-list .name { color: var(--fg); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .area-list .val { color: var(--strong); font-weight: 600; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .sub { font-size: 12px; color: var(--muted); margin: -6px 0 12px; }
  .how p { color: var(--muted); max-width: 75ch; margin-bottom: 10px; }
  .how p:last-child { margin-bottom: 0; }
  .how strong { color: var(--strong); font-weight: 600; }
  .empty { color: var(--muted); padding: 32px 0; text-align: center; }
</style>
</head>
<body>

<div class="header">
  <h1>PRECOG <span>Accuracy record</span></h1>
  <div class="meta"><span id="through"></span><a href="/news-check">News check</a><a href="/">Back to map</a></div>
</div>

<main id="main">
  <div class="empty">Loading the record…</div>
</main>

<script>
const fmtDay = iso => new Date(iso + 'T12:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
const weekLabel = w => `${fmtDay(w.week_start)} – ${fmtDay(w.week_end)}`;

function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  Object.entries(attrs || {}).forEach(([k, v]) => { if (k === 'class') e.className = v; else e.setAttribute(k, v); });
  kids.flat().forEach(k => { if (k != null) e.append(k.nodeType ? k : document.createTextNode(String(k))); });
  return e;
}

function modeChip(mode) {
  return mode === 'live'
    ? h('span', { class: 'chip live', title: 'Saved before the week began' }, 'Live')
    : h('span', { class: 'chip recon', title: 'Rebuilt afterwards using only data dated before the week' }, 'Reconstructed');
}

function areaList(areas, valueOf) {
  return h('ul', { class: 'area-list' }, areas.map(a =>
    h('li', null, h('span', { class: 'name', title: `Area ${a.npa}` }, a.label), h('span', { class: 'val' }, valueOf(a)))));
}

function lineChart(canvas, labels, datasets, yTitle) {
  const css = getComputedStyle(document.documentElement);
  const dim = css.getPropertyValue('--dim').trim(), line = css.getPropertyValue('--line').trim();
  new Chart(canvas, {
    type: 'line',
    data: { labels, datasets: datasets.map(d => ({ tension: 0.25, pointRadius: 2, borderWidth: 2, ...d })) },
    options: {
      responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { labels: { color: css.getPropertyValue('--muted').trim(), font: { size: 11 }, boxWidth: 14 } } },
      scales: {
        x: { ticks: { color: dim, maxTicksLimit: 12, font: { size: 10 } }, grid: { color: line } },
        y: { title: { display: true, text: yTitle, color: dim, font: { size: 11 } }, ticks: { color: dim, font: { size: 10 } }, grid: { color: line } },
      },
    },
  });
}

function render(data) {
  const main = document.getElementById('main');
  main.replaceChildren();
  const s = data.summary;
  const css = getComputedStyle(document.documentElement);
  const accent = css.getPropertyValue('--accent').trim(), compare = css.getPropertyValue('--compare').trim();
  if (data.data_through) document.getElementById('through').textContent = `CMPD data through ${fmtDay(data.data_through)}`;

  if (!s.weeks_scored) {
    main.append(h('div', { class: 'empty' }, 'No weeks have been scored yet. The first score appears once CMPD has published a full week after the first saved prediction.'));
    return;
  }

  const last = data.scored[0];
  main.append(h('p', { class: 'lede' },
    'Each week Precog predicts how many incidents Charlotte will see and where. This page compares those predictions with what CMPD reported afterwards, over the last ',
    h('strong', null, `${s.weeks_scored} weeks`), '. 100% would mean the prediction matched exactly.'));

  const plain = (title, big, tone, lines) => h('div', { class: 'card verdict' },
    h('div', { class: 'q' }, title),
    h('div', { class: 'big ' + tone }, big),
    lines.map(t => h('p', null, t)));
  const tone = (mine, theirs, margin = 0.01) => mine == null || theirs == null ? 'even' : mine > theirs * (1 + margin) ? 'good' : mine < theirs * (1 - margin) ? 'bad' : 'even';
  main.append(h('div', { class: 'verdicts' },
    plain('Day to day: how many incidents', `${s.daily_accuracy}% accurate`, tone(s.daily_accuracy, s.naive_daily_accuracy), [
      `On a typical day Precog is off by about ${Math.round(s.forecast_mae)} incidents out of roughly ${Math.round(s.avg_daily)}. ${s.days_within_10pct} of ${s.days_scored} days landed within 10% of the real count.`,
      `Without Precog: assuming each day matches last week's average is ${s.naive_daily_accuracy}% accurate.`]),
    plain('Week to week: the weekly total', `${s.weekly_accuracy}% accurate`, tone(s.weekly_accuracy, s.naive_weekly_accuracy), [
      `Last scored week Precog predicted ${last.predicted_total.toLocaleString()} incidents and CMPD reported ${last.total_incidents.toLocaleString()}. The worst week was off by ${s.worst_week_miss_pct}%.`,
      `Without Precog: assuming next week matches last week is ${s.naive_weekly_accuracy}% accurate.`]),
    plain('Where it happens: the busiest areas', `${s.precog_overlap} of ${data.top_n} right`, tone(s.precog_overlap, s.busiest_overlap), [
      `Each week Precog flags ${data.top_n} areas. On average ${s.precog_overlap} of them turn out to be among the ${data.top_n} areas with the most incidents.`,
      `Without Precog: picking last month's ${data.top_n} busiest areas gets ${s.busiest_overlap} right. This is Precog's weak spot.`]),
    plain('Spike alerts: did trouble follow', `${s.alerts_confirmed} of ${s.alerts_raised} held up`, tone(s.alert_rate, s.any_area_rate, 0.10), [
      `An alert holds up when the area then has a busier week than usual. ${s.alert_rate}% did.`,
      `Without Precog: ${s.any_area_rate}% of all areas have a busier week than usual anyway, so the alerts are not yet telling you much.`])));

  const weeks = data.scored.slice().reverse();
  const days = weeks.flatMap(w => w.forecast);
  const fcCanvas = h('canvas', { 'aria-label': 'Predicted versus reported incidents per day' });
  const shareCanvas = h('canvas', { 'aria-label': 'Flagged areas that were among the busiest, by week' });
  main.append(h('div', { class: 'two-col' },
    h('div', { class: 'card' }, h('h2', null, 'Daily forecast vs reported'), h('div', { class: 'chart-wrap' }, fcCanvas)),
    h('div', { class: 'card' }, h('h2', null, `Flagged areas that were right, out of ${data.top_n}`), h('div', { class: 'chart-wrap' }, shareCanvas))));
  lineChart(fcCanvas, days.map(d => fmtDay(d.date)), [
    { label: 'Reported', data: days.map(d => d.actual), borderColor: css.getPropertyValue('--strong').trim(), pointRadius: 0 },
    { label: 'Precog forecast', data: days.map(d => d.predicted), borderColor: accent, borderDash: [5, 3], pointRadius: 0 },
  ], 'Incidents per day');
  lineChart(shareCanvas, weeks.map(w => fmtDay(w.week_start)), [
    { label: 'Precog', data: weeks.map(w => w.precog_overlap), borderColor: accent },
    { label: "Last month's busiest", data: weeks.map(w => w.busiest_overlap), borderColor: compare },
  ], 'Areas right');

  main.append(h('div', { class: 'card' },
    h('h2', null, 'Week by week'),
    h('div', { class: 'scroll' }, h('table', null,
      h('thead', null, h('tr', null,
        ['Week', 'Predicted', 'Reported', 'Weekly accuracy', 'Daily accuracy', `Areas right (of ${data.top_n})`, 'Alerts held up', 'Prediction'].map(t => h('th', null, t)))),
      h('tbody', null, data.scored.map(w => h('tr', null,
        h('td', null, weekLabel(w)),
        h('td', null, w.predicted_total.toLocaleString()),
        h('td', null, w.total_incidents.toLocaleString()),
        h('td', null, `${w.weekly_accuracy}%`),
        h('td', null, `${w.daily_accuracy}%`),
        h('td', { class: w.precog_overlap > w.busiest_overlap ? 'win' : w.precog_overlap < w.busiest_overlap ? 'loss' : 'muted', title: `Simple guess got ${w.busiest_overlap}` }, w.precog_overlap),
        h('td', { class: 'muted' }, `${w.alerts_confirmed} of ${w.alerts_raised}`),
        h('td', null, modeChip(w.mode)))))))));

  main.append(h('div', { class: 'two-col' },
    h('div', { class: 'card' },
      h('h2', null, `What Precog flagged for ${weekLabel(last)}`),
      h('div', { class: 'sub' }, 'Incidents reported that week in each flagged area'),
      areaList(last.top_areas, a => a.actual)),
    h('div', { class: 'card' },
      h('h2', null, 'What the simple guess picked'),
      h('div', { class: 'sub' }, 'The busiest areas of the previous four weeks, and what they saw'),
      areaList(last.busiest_areas, a => a.actual))));

  if (data.pending.length) {
    main.append(h('div', { class: 'two-col' }, data.pending.slice().reverse().map(w => {
      const expected = w.forecast.reduce((sum, d) => sum + d.predicted, 0);
      return h('div', { class: 'card' },
        h('h2', null, `On record for ${weekLabel(w)}`),
        h('div', { class: 'sub' }, modeChip(w.mode), ` Using data through ${fmtDay(w.data_through)}. `,
          expected ? `Expecting about ${Math.round(expected).toLocaleString()} incidents. ` : '', 'Scored once CMPD publishes the full week.'),
        areaList(w.top_areas, a => `risk ${a.risk_score}`));
    })));
  }

  main.append(h('div', { class: 'card how' },
    h('h2', null, 'How the scoring works'),
    h('p', null, h('strong', null, 'Weeks run Monday to Sunday. '), 'Before each week, Precog\'s top areas, daily forecast and spike alerts are saved. The server checks CMPD every hour, and a week is scored two days after it ends, because CMPD keeps adding reports for about that long.'),
    h('p', null, h('strong', null, 'Live vs reconstructed. '), '"Live" predictions were saved before the week began and cannot be changed afterwards. "Reconstructed" ones were rebuilt later, with everything dated on or after that Monday hidden from the models. They are a fair test, but only live weeks are proof.'),
    h('p', null, h('strong', null, 'What "accurate" means. '), 'For counts, 93% accurate means the prediction was off by 7% of the real number on average. For areas, a flagged area is "right" when it ends up among the busiest that week.'),
    h('p', null, h('strong', null, 'Why "without Precog" is shown. '), 'Crime counts are steady from week to week, so even a rough guess scores high. Green means Precog beat the guess anyone could make, red means it did not, yellow means about the same.')));
}

fetch('/api/accuracy')
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(render)
  .catch(() => { document.getElementById('main').replaceChildren(h('div', { class: 'empty' }, 'The accuracy record could not be loaded. Check that the server is running, then reload.')); });
</script>
</body>
</html>
